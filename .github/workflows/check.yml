name: Check skills and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(vars.RSI_SKILLS_RUNNER || '"ubuntu-latest"') }}
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local-only records
        run: |
          tracked_local=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_local" ]; then
            echo 'Files intended only for local use are tracked:'
            echo "$tracked_local"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skills and installer
        run: |
          python scripts/skills.py check
          python -m unittest discover -s tests -v
          sh -n install.sh
      - name: Whole-library installation smoke test
        run: |
          skill_target="$RUNNER_TEMP/rsi runtime/skills"
          ./install.sh --target "$skill_target"
          ./install.sh --target "$skill_target"
          python scripts/skills.py uninstall --target "$skill_target"
      - name: Build and install the standalone dependency
        run: |
          bash .github/network.sh python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/package-env"
          bash .github/network.sh "$RUNNER_TEMP/package-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/rsi_skills-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-env/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path
          from rsi_skills import install, open_snapshot
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              snapshot = install(root / "skills")
              assert len(snapshot.entries()) == 11
              assert (snapshot.root / "rsi-kaggle-reproduce/references/evidence-contract.md").is_file()
              assert "rsi-artifact-check" in open_snapshot(root / "skills").read("rsi-artifact-check")
              assert (snapshot.root / "rsi-kaggle-open-sota/scripts/discover.py").is_file()
          PY
